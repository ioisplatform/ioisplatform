<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOIS PLATFORM | प्रीमियम पोर्टल</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --saffron: #FF9933;
            --white: #FFFFFF;
            --green: #138808;
            --navy: #000080;
            --bg-dark: #0a0e17;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            margin: 0;
            padding: 0;
        }

        /* 3D Premium Header */
        header {
            padding: 40px 20px;
            text-align: center;
        }

        .brand-name {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            /* 3D Effect */
            text-shadow: 4px 4px 0px var(--navy), 0 0 20px var(--saffron);
            margin: 0;
        }

        .slogan {
            font-size: 1.1rem;
            color: var(--saffron);
            letter-spacing: 3px;
            font-weight: bold;
        }

        /* Navigation */
        nav { display: flex; justify-content: center; gap: 10px; padding: 20px; flex-wrap: wrap; }
        nav button {
            background: rgba(255,255,255,0.1);
            border: 2px solid transparent;
            color: white;
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        nav button.active { background: var(--navy); border-color: var(--saffron); box-shadow: 0 0 15px var(--saffron); }

        /* Form Styling */
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 450px;
            margin: 20px auto;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        label { color: #ccc; font-size: 0.9rem; margin-top: 15px; display: block; }
        input {
            width: 100%;
            padding: 15px;
            margin-top: 5px;
            background: rgba(0,0,0,0.3);
            border: 1px solid #444;
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .btn-submit {
            background: linear-gradient(90deg, var(--saffron), var(--green));
            color: white;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 25px;
            text-transform: uppercase;
        }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <h1 class="brand-name">IOIS</h1>
        <div class="slogan">बदलते भारत की शान</div>
    </header>

    <nav>
        <button onclick="show('home')" class="active" id="b-home">🏠 Home</button>
        <button onclick="show('register')" id="b-register">📝 Register</button>
        <button onclick="show('login')" id="b-login">🔑 Dashboard</button>
    </nav>

    <!-- Home -->
    <div id="home" class="page active">
        <div class="card" style="text-align: center;">
            <h2 style="color: var(--saffron);">Welcome</h2>
            <p>IOIS Platform में आपका स्वागत है।</p>
            <p>जय हिन्द! 🇮🇳</p>
        </div>
    </div>

    <!-- Registration -->
    <div id="register" class="page">
        <div class="card">
            <h2 style="color: var(--saffron); text-align: center;">Registration</h2>
            
            <label>Full Name</label>
            <input type="text" id="regName" placeholder="Enter Full Name">
            
            <label>Mobile Number</label>
            <input type="tel" id="regPhone" placeholder="Enter Mobile Number">
            
            <label>UTR Number (12 Digit)</label>
            <input type="text" id="regUTR" placeholder="Enter UTR Number">
            
            <label>Referral Code</label>
            <input type="text" id="regRef" placeholder="Enter Referral Code">
            
            <button class="btn-submit" onclick="submitData()">Submit Details</button>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="login" class="page">
        <div class="card">
            <h2 style="color: var(--saffron); text-align: center;">Dashboard</h2>
            <label>User ID</label>
            <input type="text" id="loginId" placeholder="Enter User ID">
            <button class="btn-submit" onclick="alert('Verifying...')">Login</button>
        </div>
    </div>

    <script>
        function show(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('b-' + id).classList.add('active');
        }

        function submitData() {
            const name = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const utr = document.getElementById('regUTR').value;
            const ref = document.getElementById('regRef').value;

            if(!name || !phone || !utr) {
                alert("कृपया सभी जानकारी भरें!");
                return;
            }
            alert("डेटा प्राप्त हुआ: " + name + "\nसत्यापन के लिए भेजा गया!");
        }
    </script>
</body>
</html>
